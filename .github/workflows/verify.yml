# Reuse independently selectable gates without confusing partial runs with full verification.
name: Verification jobs
on:
  workflow_call:
    inputs:
      quality:
        type: boolean
        default: true
      unit:
        type: boolean
        default: true
      build:
        type: boolean
        default: true
      browser:
        type: boolean
        default: true
      commits:
        type: boolean
        default: true
      project:
        type: string
        default: both
      grep:
        type: string
        default: ''
      unit_filter:
        type: string
        default: ''
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  plan:
    name: Selection
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      build_required: ${{ steps.selection.outputs.build_required }}
      projects: ${{ steps.selection.outputs.projects }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: selection
        name: Validate selection
        env:
          CI_SELECTION_JSON: ${{ toJSON(inputs) }}
        run: python3 scripts/ci/selection.py
  quality:
    name: Quality
    needs: plan
    if: inputs.quality
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/node-environment
      - name: Types, lint, and format
        run: npm run check && npm run lint && npm run format:check
      - name: Workflow selection and result regression tests
        run: npm run test:ci
      - name: Validate every workflow
        run: npm run lint:workflows
  unit:
    name: Unit and WASM
    needs: plan
    if: inputs.unit
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/node-environment
      - name: Run selected unit tests
        env:
          UNIT_FILTER: ${{ inputs.unit_filter }}
        run: |
          if [[ -n "$UNIT_FILTER" ]]; then
            npm run test -- "$UNIT_FILTER"
          else
            npm run test
          fi
  build:
    name: Production build
    needs: plan
    if: needs.plan.outputs.build_required == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/node-environment
      - run: npm run build
      - name: Save verified build inputs for browser jobs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
  browser:
    name: Browser (${{ matrix.project }})
    needs: [plan, build]
    if: inputs.browser
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(needs.plan.outputs.projects) }}
    env:
      CI: 'true'
      PLAYWRIGHT_PREBUILT: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/node-environment
      - name: Restore the same production build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: production-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/
      - name: Install matching Chromium headless shell and system libraries
        run: npx playwright install --with-deps --only-shell chromium
      - name: Run selected browser scenarios
        env:
          BROWSER_PROJECT: ${{ matrix.project }}
          BROWSER_GREP: ${{ inputs.grep }}
        run: |
          args=(--project "$BROWSER_PROJECT")
          if [[ -n "$BROWSER_GREP" ]]; then
            args+=(--grep "$BROWSER_GREP")
          fi
          npm run test:e2e -- "${args[@]}"
      - name: Preserve HTML, JUnit, and failure traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-${{ matrix.project }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 7
  commits:
    name: Commit messages
    needs: plan
    if: inputs.commits
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check actual source commits, not a synthetic PR merge
        run: python3 scripts/ci/commits.py
  result:
    name: ${{ inputs.quality && inputs.unit && inputs.browser && inputs.commits && inputs.project == 'both' && inputs.grep == '' && inputs.unit_filter == '' && 'Full verification' || 'Selected verification' }}
    needs: [plan, quality, unit, build, browser, commits]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require success for every selected gate
        env:
          CI_SELECTION_JSON: ${{ toJSON(inputs) }}
          CI_RESULTS_JSON: ${{ toJSON(needs) }}
        run: python3 scripts/ci/result.py
